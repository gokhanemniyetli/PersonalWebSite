<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hafıza Kartları</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#05070c;color:#fff;font:16px monospace}.wrap{text-align:center}.grid{display:grid;grid-template-columns:repeat(4,80px);gap:10px}.card{height:80px;border:1px solid #00fff0;background:#0b1822;color:transparent;font-size:28px;cursor:pointer}.card.open,.card.done{color:#fff;background:#ff168f}.card.done{background:#00a99d}button.reset{margin:20px;padding:10px 18px;background:#fff000;border:0;font:inherit;cursor:pointer}@media(max-width:420px){.grid{grid-template-columns:repeat(4,62px)}.card{height:62px}}</style></head><body><main class="wrap"><h1>HAFIZA KARTLARI</h1><p>Eşleri bul: <b id="moves">0</b> hamle</p><div class="grid" id="grid"></div><button class="reset" id="reset">YENİDEN BAŞLAT</button></main><script>const grid=document.querySelector('#grid'),icons=['◆','★','●','▲','♥','☀','♣','♦'];let first=null,lock=false,moves=0;function start(){grid.innerHTML='';first=null;lock=false;moves=0;document.querySelector('#moves').textContent=0;[...icons,...icons].sort(()=>Math.random()-.5).forEach(icon=>{let b=document.createElement('button');b.className='card';b.textContent=icon;b.dataset.icon=icon;b.onclick=()=>flip(b);grid.appendChild(b)})}function flip(b){if(lock||b.classList.contains('open')||b.classList.contains('done'))return;b.classList.add('open');if(!first){first=b;return}moves++;document.querySelector('#moves').textContent=moves;if(first.dataset.icon===b.dataset.icon){first.classList.add('done');b.classList.add('done');first=null}else{lock=true;setTimeout(()=>{first.classList.remove('open');b.classList.remove('open');first=null;lock=false},650)}}document.querySelector('#reset').onclick=start;start();</script></body></html>
