<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Yılan</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#05070c;color:#00fff0;font:16px monospace}.wrap{text-align:center}canvas{display:block;width:min(90vw,420px);height:auto;border:2px solid #00fff0;background:#08131b;box-shadow:0 0 30px #00fff055}button{margin:14px;padding:10px 18px;background:#ff168f;color:#fff;border:0;font:inherit;cursor:pointer}p{color:#fff}</style></head><body><main class="wrap"><h1>NEON YILAN</h1><p>Skor: <b id="score">0</b> | Ok tuşları / WASD</p><canvas id="game" width="400" height="400"></canvas><button id="reset">YENİDEN BAŞLAT</button></main><script>const c=document.querySelector('#game'),x=c.getContext('2d'),n=20,s=20;let snake,food,dir,score,timer;function reset(){snake=[{x:10,y:10}];food={x:15,y:10};dir={x:1,y:0};score=0;document.querySelector('#score').textContent=0;clearInterval(timer);timer=setInterval(tick,110);draw()}function place(){do{food={x:Math.floor(Math.random()*n),y:Math.floor(Math.random()*n)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}function tick(){let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=n||h.y>=n||snake.some(p=>p.x===h.x&&p.y===h.y)){reset();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;document.querySelector('#score').textContent=score;place()}else snake.pop();draw()}function draw(){x.fillStyle='#08131b';x.fillRect(0,0,400,400);x.fillStyle='#ff168f';x.fillRect(food.x*s,food.y*s,s-2,s-2);x.fillStyle='#00fff0';snake.forEach(p=>x.fillRect(p.x*s,p.y*s,s-2,s-2))}addEventListener('keydown',e=>{let d={ArrowUp:{x:0,y:-1},w:{x:0,y:-1},ArrowDown:{x:0,y:1},s:{x:0,y:1},ArrowLeft:{x:-1,y:0},a:{x:-1,y:0},ArrowRight:{x:1,y:0},d:{x:1,y:0}}[e.key];if(d&&d.x!==-dir.x||d&&d.y!==-dir.y)dir=d});document.querySelector('#reset').onclick=reset;reset();</script></body></html>
