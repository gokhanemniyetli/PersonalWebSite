<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kamyon Teslimatı</title>
<style>
:root{--accent:#ffcc00}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;overflow:hidden;font-family:'Courier New',monospace}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;z-index:2}
.panel{position:absolute;top:16px;left:16px;background:rgba(0,0,0,.55);padding:10px 14px;border:1px solid var(--accent);border-radius:4px;font-size:12px;line-height:1.8}
.panel b{color:var(--accent)}
#msg{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);text-align:center;background:rgba(0,0,0,.78);padding:24px 32px;border:1px solid var(--accent);border-radius:6px;display:none}
#msg button{margin-top:14px;padding:10px 18px;background:var(--accent);border:0;color:#05070a;font:bold 12px 'Courier New',monospace;cursor:pointer;pointer-events:all}
#tip{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:10px;color:rgba(255,255,255,.55);white-space:nowrap;text-align:center}
</style>
</head>
<body>
<div id="hud">
  <div class="panel" id="stats">TESLİMAT 0</div>
  <div id="msg"><h2 id="msgTitle">SÜRE DOLDU</h2><p id="msgText"></p><button id="msgBtn">YENİDEN BAŞLA</button></div>
  <div id="tip">W/S veya ↑/↓: GAZ-FREN | A/D veya ←/→: DÖN | R: YENİDEN BAŞLA</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x33445a);scene.fog=new THREE.FogExp2(0x33445a,0.005);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,700);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,1.2));
const sun=new THREE.DirectionalLight(0xffffff,1.3);sun.position.set(120,180,80);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshLambertMaterial({color:0x33402e}));ground.rotation.x=-Math.PI/2;scene.add(ground);

const buildings=[];
const bMat=[0xc8b090,0xaab0c0,0xd0c8b0,0x90a8b8].map(c=>new THREE.MeshLambertMaterial({color:c}));
for(let i=0;i<32;i++){
  const w=8+Math.random()*14,d=8+Math.random()*14,h=8+Math.random()*30;
  let x,z;do{x=(Math.random()-0.5)*340;z=(Math.random()-0.5)*340;}while(Math.hypot(x,z)<22);
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),bMat[i%4]);mesh.position.set(x,h/2,z);scene.add(mesh);
  buildings.push({x,z,w,d});
}
function blocked(x,z,margin){return buildings.some(b=>Math.abs(x-b.x)<b.w/2+margin&&Math.abs(z-b.z)<b.d/2+margin);}

function makeTrafficCar(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(2,0.8,4),new THREE.MeshLambertMaterial({color:0xaa2222}));body.position.y=0.5;g.add(body);
  scene.add(g);
  let x,z;do{x=(Math.random()-0.5)*300;z=(Math.random()-0.5)*300;}while(blocked(x,z,4));
  g.position.set(x,0.5,z);
  return{group:g,heading:Math.random()*Math.PI*2,speed:4+Math.random()*3,x,z};
}
const traffic=[];for(let i=0;i<6;i++)traffic.push(makeTrafficCar());

const truck=new THREE.Group();
const cab=new THREE.Mesh(new THREE.BoxGeometry(2.4,1.4,2.2),new THREE.MeshLambertMaterial({color:0xffcc00}));cab.position.set(0,0.9,1.6);truck.add(cab);
const trailer=new THREE.Mesh(new THREE.BoxGeometry(2.6,1.8,4.6),new THREE.MeshLambertMaterial({color:0xdddddd}));trailer.position.set(0,1.1,-1.2);truck.add(trailer);
scene.add(truck);

function randomSpot(){let x,z;do{x=(Math.random()-0.5)*320;z=(Math.random()-0.5)*320;}while(blocked(x,z,4));return{x,z};}
const pickupMesh=new THREE.Mesh(new THREE.CylinderGeometry(3,3,0.3,16),new THREE.MeshBasicMaterial({color:0x3388ff}));scene.add(pickupMesh);
const dropMesh=new THREE.Mesh(new THREE.CylinderGeometry(3,3,0.3,16),new THREE.MeshBasicMaterial({color:0x33cc55}));scene.add(dropMesh);
let pickup=randomSpot(),drop=randomSpot();
pickupMesh.position.set(pickup.x,0.2,pickup.z);dropMesh.position.set(drop.x,0.2,drop.z);dropMesh.visible=false;

let px=0,pz=0,heading=0,speed=0,health=100,deliveries=0,loaded=false,timeLeft=90,over=false;
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='r')restart();if(e.code==='Space')e.preventDefault();});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function damage(a){if(over)return;health=Math.max(0,health-a);if(health<=0)endGame('KAMYON HASAR ALDI');}
function updateTruck(dt){
  const up=keys['w']||keys['arrowup'],down=keys['s']||keys['arrowdown'],left=keys['a']||keys['arrowleft'],right=keys['d']||keys['arrowright'];
  if(up)speed=Math.min(speed+14*dt,24);else if(down)speed=Math.max(speed-13*dt,-10);else speed*=Math.pow(0.9,dt*60);
  const turnAmt=1.6*dt*(0.3+0.7*Math.min(1,Math.abs(speed)/24))*(speed<0?-1:1);
  if(left)heading+=turnAmt;if(right)heading-=turnAmt;
  const nx=px+Math.sin(heading)*speed*dt,nz=pz+Math.cos(heading)*speed*dt;
  if(blocked(nx,nz,1.8)){if(Math.abs(speed)>6)damage(Math.abs(speed)*0.5);speed*=-0.3;}
  else{px=nx;pz=nz;}
  px=Math.max(-195,Math.min(195,px));pz=Math.max(-195,Math.min(195,pz));
  truck.position.set(px,0,pz);truck.rotation.y=heading;
  if(!loaded&&Math.hypot(px-pickup.x,pz-pickup.z)<5){loaded=true;pickupMesh.visible=false;dropMesh.visible=true;}
  else if(loaded&&Math.hypot(px-drop.x,pz-drop.z)<5){loaded=false;deliveries++;pickup=randomSpot();drop=randomSpot();pickupMesh.position.set(pickup.x,0.2,pickup.z);dropMesh.position.set(drop.x,0.2,drop.z);pickupMesh.visible=true;dropMesh.visible=false;}
}
function updateTraffic(dt){
  traffic.forEach(t=>{
    const nx=t.x+Math.sin(t.heading)*t.speed*dt,nz=t.z+Math.cos(t.heading)*t.speed*dt;
    if(blocked(nx,nz,2)||Math.abs(nx)>195||Math.abs(nz)>195){t.heading+=Math.PI+(Math.random()-0.5);}
    else{t.x=nx;t.z=nz;}
    t.group.position.set(t.x,0.5,t.z);t.group.rotation.y=t.heading;
    if(!over&&Math.hypot(t.x-px,t.z-pz)<3.4){damage(24*dt);speed*=-0.4;}
  });
}
function endGame(title){over=true;clearInterval(timerId);document.querySelector('#msg').style.display='block';document.querySelector('#msgTitle').textContent=title||'SÜRE DOLDU';document.querySelector('#msgText').textContent='Teslimat: '+deliveries;}
function restart(){px=0;pz=0;heading=0;speed=0;health=100;deliveries=0;loaded=false;timeLeft=90;over=false;pickup=randomSpot();drop=randomSpot();pickupMesh.position.set(pickup.x,0.2,pickup.z);dropMesh.position.set(drop.x,0.2,drop.z);pickupMesh.visible=true;dropMesh.visible=false;document.querySelector('#msg').style.display='none';clearInterval(timerId);startTimer();}
document.querySelector('#msgBtn').onclick=restart;
function startTimer(){timerId=setInterval(()=>{if(over)return;timeLeft--;if(timeLeft<=0){timeLeft=0;endGame('SÜRE DOLDU');}updateHUD();},1000);}
let timerId;startTimer();
function updateHUD(){document.querySelector('#stats').innerHTML='TESLİMAT <b>'+deliveries+'</b><br>DURUM <b>'+(loaded?'YÜKLÜ':'BOŞ')+'</b><br>CAN <b>'+Math.round(health)+'%</b><br>SÜRE <b>'+timeLeft+'s</b>';}
function updateCamera(){const tx=px-Math.sin(heading)*12,tz=pz-Math.cos(heading)*12;camera.position.lerp(new THREE.Vector3(tx,5.5,tz),0.12);camera.lookAt(px,1.4,pz);}
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),0.05);if(!over){updateTruck(dt);updateTraffic(dt);}updateHUD();updateCamera();renderer.render(scene,camera);}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
