<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Pong — Basit ve Şık</title>
<style>
  :root{
    --bg:#0b1220;
    --fg:#e6edf3;
    --accent:#66d9ef;
    --muted:#9fb6c6;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#061018 0%, #081827 100%);color:var(--fg)}
  .wrap{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:20px}
  canvas{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:12px;box-shadow:0 6px 30px rgba(0,0,0,0.6);max-width:100%;height:auto}
  .ui{display:flex;gap:12px;align-items:center;justify-content:space-between;width:820px;max-width:100%}
  .title{font-weight:700;letter-spacing:0.6px}
  .controls{color:var(--muted);font-size:14px}
  .btn{background:transparent;border:1px solid rgba(255,255,255,0.08);color:var(--fg);padding:8px 12px;border-radius:8px;cursor:pointer}
  .small{font-size:13px;color:var(--muted)}
  footer{margin-top:8px;color:var(--muted);font-size:13px}
  @media (max-width:720px){
    .ui{width:100%}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="ui">
    <div>
      <div class="title">Pong — Ali'nin Oyunu</div>
      <div class="small">W/S = Sol oyuncu • ↑/↓ = Sağ oyuncu • P = Pause • R = Reset</div>
    </div>
    <div class="controls">
      <button class="btn" id="modeBtn">Tek Oyuncu (AI)</button>
      <button class="btn" id="resetBtn">Sıfırla</button>
    </div>
  </div>

  <canvas id="game" width="800" height="500"></canvas>
  <footer>Skor: <span id="scoreDisplay">0 - 0</span></footer>
</div>

<script>
/*
  Basit, hatasız Pong oyunu.
  Kontroller:
   - Sol oyuncu: W (yukarı), S (aşağı)
   - Sağ oyuncu: ArrowUp, ArrowDown
   - P: Duraklat / Devam
   - R: Sıfırla skor ve başla
   - Mode: Tek oyuncu (sağ taraf AI) / İki oyuncu
   - Mobil: Ekrana dokunma -> üst yarı = yukarı, alt yarı = aşağı (sol/sağ için dokunmayı ayırır)
*/

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreDisplay = document.getElementById('scoreDisplay');
const modeBtn = document.getElementById('modeBtn');
const resetBtn = document.getElementById('resetBtn');

const W = canvas.width, H = canvas.height;

let settings = {
  paddleWidth: 12,
  paddleHeight: 110,
  paddleSpeed: 420, // px/s
  ballRadius: 9,
  ballSpeedStart: 360, // px/s
  ballSpeedMax: 1200,
  speedIncreaseOnHit: 1.07,
  aiSpeed: 360, // px/s
  winningScore: 10
};

let state = {
  left: { x: 20, y: H/2 - settings.paddleHeight/2, vy:0, score:0 },
  right: { x: W - 20 - settings.paddleWidth, y: H/2 - settings.paddleHeight/2, vy:0, score:0 },
  ball: { x: W/2, y: H/2, vx: 0, vy: 0, speed: settings.ballSpeedStart },
  running: false,
  paused: false,
  lastTime: null,
  singlePlayer: true,
  touchControl: { leftTouch: null, rightTouch: null } // mobile touches
};

// Audio small beep
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function beep(freq=440, dur=0.07, vol=0.08){
  try{
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = freq;
    g.gain.value = vol;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    setTimeout(()=>{ o.stop(); }, dur*1000);
  }catch(e){}
}

// Helpers
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function resetBall(direction= (Math.random()<0.5? -1: 1) ){
  state.ball.x = W/2;
  state.ball.y = H/2;
  state.ball.speed = settings.ballSpeedStart;
  // angle between -40 and 40 degrees
  const maxAngle = 40 * Math.PI/180;
  const ang = (Math.random()*2 -1) * maxAngle;
  state.ball.vx = direction * Math.cos(ang) * state.ball.speed;
  state.ball.vy = Math.sin(ang) * state.ball.speed;
}

// Collision paddle
function checkPaddleCollision(paddle){
  const pLeft = paddle.x;
  const pRight = paddle.x + settings.paddleWidth;
  const bLeft = state.ball.x - settings.ballRadius;
  const bRight = state.ball.x + settings.ballRadius;
  const top = paddle.y;
  const bottom = paddle.y + settings.paddleHeight;

  if (bRight >= pLeft && bLeft <= pRight && state.ball.y >= top && state.ball.y <= bottom){
    return true;
  }
  return false;
}

// When paddle hit, reflect and alter angle
function handlePaddleHit(paddle, isLeft){
  // find relative hit position -1 .. 1
  const paddleCenter = paddle.y + settings.paddleHeight/2;
  const relative = (state.ball.y - paddleCenter) / (settings.paddleHeight/2);
  const maxBounce = 65 * Math.PI/180; // max 65 degrees
  const angle = relative * maxBounce;
  const dir = isLeft ? 1 : -1;
  // increase speed
  state.ball.speed = Math.min(state.ball.speed * settings.speedIncreaseOnHit, settings.ballSpeedMax);
  state.ball.vx = dir * Math.cos(angle) * state.ball.speed;
  state.ball.vy = Math.sin(angle) * state.ball.speed;
  beep(500 + Math.abs(state.ball.speed)/4, 0.06, 0.08);
}

// Reset game scores and positions
function resetGame(){
  state.left.score = 0;
  state.right.score = 0;
  state.left.y = H/2 - settings.paddleHeight/2;
  state.right.y = H/2 - settings.paddleHeight/2;
  resetBall(Math.random() < 0.5 ? -1 : 1);
  state.running = true;
  state.paused = false;
  updateScoreUI();
}

// Score UI
function updateScoreUI(){
  scoreDisplay.textContent = `${state.left.score} — ${state.right.score}`;
}

// Game loop
function loop(ts){
  if (!state.running) { state.lastTime = ts; requestAnimationFrame(loop); return; }
  if (state.paused) { state.lastTime = ts; requestAnimationFrame(loop); return; }
  const dt = state.lastTime ? Math.min((ts - state.lastTime)/1000, 0.032) : 0.016; // cap dt
  state.lastTime = ts;

  // --- update paddles from velocity
  state.left.y += state.left.vy * dt;
  state.right.y += state.right.vy * dt;

  // clamp paddles
  state.left.y = clamp(state.left.y, 0, H - settings.paddleHeight);
  state.right.y = clamp(state.right.y, 0, H - settings.paddleHeight);

  // AI for right paddle if single player
  if (state.singlePlayer){
    const target = state.ball.y;
    const center = state.right.y + settings.paddleHeight/2;
    const diff = target - center;
    const sign = Math.sign(diff);
    const aiStep = settings.aiSpeed * dt;
    if (Math.abs(diff) > 8) {
      state.right.y += clamp(diff, -aiStep, aiStep);
      state.right.y = clamp(state.right.y, 0, H - settings.paddleHeight);
    }
  }

  // move ball
  state.ball.x += state.ball.vx * dt;
  state.ball.y += state.ball.vy * dt;

  // top/bottom wall collision
  if (state.ball.y - settings.ballRadius <= 0){
    state.ball.y = settings.ballRadius;
    state.ball.vy = -state.ball.vy;
    beep(300, 0.04, 0.07);
  } else if (state.ball.y + settings.ballRadius >= H){
    state.ball.y = H - settings.ballRadius;
    state.ball.vy = -state.ball.vy;
    beep(300, 0.04, 0.07);
  }

  // paddle collisions
  if (state.ball.vx < 0 && checkPaddleCollision(state.left)){
    // ensure we only reflect when approaching
    if (state.ball.x - settings.ballRadius <= state.left.x + settings.paddleWidth + 4){
      state.ball.x = state.left.x + settings.paddleWidth + settings.ballRadius + 1;
      handlePaddleHit(state.left, true);
    }
  } else if (state.ball.vx > 0 && checkPaddleCollision(state.right)){
    if (state.ball.x + settings.ballRadius >= state.right.x - 4){
      state.ball.x = state.right.x - settings.ballRadius - 1;
      handlePaddleHit(state.right, false);
    }
  }

  // score check
  if (state.ball.x < -50){
    // right player scores
    state.right.score += 1;
    updateScoreUI();
    if (state.right.score >= settings.winningScore) {
      winner('Sağ Oyuncu');
      return;
    }
    resetBall(1);
  } else if (state.ball.x > W + 50){
    state.left.score += 1;
    updateScoreUI();
    if (state.left.score >= settings.winningScore) {
      winner('Sol Oyuncu');
      return;
    }
    resetBall(-1);
  }

  draw();
  requestAnimationFrame(loop);
}

// Draw everything
function draw(){
  ctx.clearRect(0,0,W,H);
  // center dashed line
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  const dashH = 20, gap = 14;
  for (let y = 10; y < H; y += dashH + gap){
    ctx.fillRect(W/2 - 3, y, 6, dashH);
  }

  // paddles
  ctx.fillStyle = 'rgba(230,237,243,0.95)';
  roundRect(ctx, state.left.x, state.left.y, settings.paddleWidth, settings.paddleHeight, 8);
  roundRect(ctx, state.right.x, state.right.y, settings.paddleWidth, settings.paddleHeight, 8);

  // ball
  ctx.beginPath();
  ctx.fillStyle = 'white';
  ctx.arc(state.ball.x, state.ball.y, settings.ballRadius, 0, Math.PI*2);
  ctx.fill();

  // scores (big)
  ctx.fillStyle = 'rgba(230,237,243,0.85)';
  ctx.font = '40px Inter, system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(state.left.score, W/2 - 120, 60);
  ctx.fillText(state.right.score, W/2 + 120, 60);
}

// rounded rect helper
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
  ctx.fill();
}

function winner(name){
  state.running = false;
  state.paused = true;
  setTimeout(()=>{ alert(name + ' kazandı! (R ile yeniden başlat veya Sıfırla düğmesine bas)'); }, 80);
}

// input handling
const keys = {};
window.addEventListener('keydown', e=>{
  if (e.key === 'w' || e.key === 'W'){ keys.w=true; }
  if (e.key === 's' || e.key === 'S'){ keys.s=true; }
  if (e.key === 'ArrowUp'){ keys.up=true; }
  if (e.key === 'ArrowDown'){ keys.down=true; }
  if (e.key === 'p' || e.key === 'P'){ state.paused = !state.paused; if (!state.running) state.running=true; }
  if (e.key === 'r' || e.key === 'R'){ resetGame(); }
  updateVelFromKeys();
});
window.addEventListener('keyup', e=>{
  if (e.key === 'w' || e.key === 'W'){ keys.w=false; }
  if (e.key === 's' || e.key === 'S'){ keys.s=false; }
  if (e.key === 'ArrowUp'){ keys.up=false; }
  if (e.key === 'ArrowDown'){ keys.down=false; }
  updateVelFromKeys();
});

function updateVelFromKeys(){
  // left paddle
  if (keys.w && !keys.s) state.left.vy = -settings.paddleSpeed;
  else if (keys.s && !keys.w) state.left.vy = settings.paddleSpeed;
  else state.left.vy = 0;

  // right paddle only if two-player
  if (!state.singlePlayer){
    if (keys.up && !keys.down) state.right.vy = -settings.paddleSpeed;
    else if (keys.down && !keys.up) state.right.vy = settings.paddleSpeed;
    else state.right.vy = 0;
  } else {
    state.right.vy = 0;
  }
}

// mouse move for left paddle (optional)
canvas.addEventListener('mousemove', e=>{
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  // move left paddle when mouse is on left half
  if (mx < W/2){
    state.left.y = clamp(my - settings.paddleHeight/2, 0, H - settings.paddleHeight);
  }
});

// touch controls for mobile
canvas.addEventListener('touchstart', handleTouch, {passive:false});
canvas.addEventListener('touchmove', handleTouch, {passive:false});
canvas.addEventListener('touchend', (e)=>{
  state.touchControl.leftTouch = null;
  state.touchControl.rightTouch = null;
}, {passive:true});

function handleTouch(e){
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  // reset velocities for touch control
  state.left.vy = 0;
  if (!state.singlePlayer) state.right.vy = 0;

  for (const t of e.touches){
    const x = t.clientX - rect.left;
    const y = t.clientY - rect.top;
    if (x < W/2){
      // left area
      if (y < H/2) state.left.vy = -settings.paddleSpeed;
      else state.left.vy = settings.paddleSpeed;
    } else {
      // right area
      if (!state.singlePlayer){
        if (y < H/2) state.right.vy = -settings.paddleSpeed;
        else state.right.vy = settings.paddleSpeed;
      } else {
        // if single player, tapping right half nudges AI (optional) - do nothing
      }
    }
  }
}

// UI buttons
modeBtn.addEventListener('click', ()=>{
  state.singlePlayer = !state.singlePlayer;
  modeBtn.textContent = state.singlePlayer ? 'Tek Oyuncu (AI)' : 'İki Oyuncu';
  state.right.vy = 0;
});

resetBtn.addEventListener('click', ()=>{ resetGame(); });

// start initial
resetGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
