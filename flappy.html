<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Uçuş</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#061222;color:#fff;font:16px monospace}.wrap{text-align:center}canvas{width:min(92vw,420px);height:auto;border:2px solid #00fff0;background:linear-gradient(#102a54,#07121d)}button{margin:14px;padding:10px 18px;background:#ff168f;color:#fff;border:0;font:inherit;cursor:pointer}</style></head><body><main class="wrap"><h1>NEON UÇUŞ</h1><p>Skor: <b id="score">0</b> | Boşluk / Tıkla</p><canvas id="game" width="420" height="560"></canvas><button id="reset">YENİDEN BAŞLAT</button></main><script>const c=document.querySelector('#game'),x=c.getContext('2d');let bird,pipes,score,over,last;function reset(){bird={x:80,y:280,v:0};pipes=[];score=0;over=false;last=0;document.querySelector('#score').textContent=0;requestAnimationFrame(loop)}function flap(){if(over){reset();return}bird.v=-7}addEventListener('keydown',e=>{if(e.code==='Space')flap()});c.onclick=flap;document.querySelector('#reset').onclick=reset;function loop(t){if(over)return;let dt=Math.min((t-last)/16,2);last=t;bird.v+=.35*dt;bird.y+=bird.v*dt;if(!pipes.length||pipes[pipes.length-1].x<230){let gap=145,top=60+Math.random()*230;pipes.push({x:420,top,gap,passed:false})}pipes.forEach(p=>p.x-=2.8*dt);pipes=pipes.filter(p=>p.x>-60);pipes.forEach(p=>{if(!p.passed&&p.x+55<bird.x){p.passed=true;score++;document.querySelector('#score').textContent=score}if(bird.x+16>p.x&&bird.x-16<p.x+55&&(bird.y-16<p.top||bird.y+16>p.top+p.gap))over=true});if(bird.y<0||bird.y>560)over=true;draw();if(over){x.fillStyle='#ff168f';x.font='28px monospace';x.fillText('OYUN BİTTİ',115,280);return}requestAnimationFrame(loop)}function draw(){x.clearRect(0,0,420,560);x.fillStyle='#00fff0';pipes.forEach(p=>{x.fillRect(p.x,0,55,p.top);x.fillRect(p.x,p.top+p.gap,55,560)});x.fillStyle='#fff000';x.beginPath();x.arc(bird.x,bird.y,16,0,7);x.fill()}reset();</script></body></html>
