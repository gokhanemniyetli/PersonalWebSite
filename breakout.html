<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tuğla Kırma</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080511;color:#fff;font:16px monospace}.wrap{text-align:center}canvas{width:min(94vw,500px);height:auto;border:2px solid #fff000;background:#12091b}button{margin:14px;padding:10px 18px;background:#ff168f;color:#fff;border:0;font:inherit;cursor:pointer}</style></head><body><main class="wrap"><h1>TUĞLA KIRMA</h1><p>Skor: <b id="score">0</b> | Fare / ← →</p><canvas id="game" width="500" height="600"></canvas><button id="reset">YENİDEN BAŞLAT</button></main><script>const c=document.querySelector('#game'),x=c.getContext('2d');let p,b,bricks,score,over;function reset(){p={x:215};b={x:250,y:450,vx:3,vy:-4};bricks=[];score=0;over=false;for(let r=0;r<5;r++)for(let q=0;q<8;q++)bricks.push({x:12+q*61,y:45+r*28,w:50,h:17,on:true});document.querySelector('#score').textContent=0;requestAnimationFrame(loop)}addEventListener('keydown',e=>{if(e.key==='ArrowLeft')p.x-=28;if(e.key==='ArrowRight')p.x+=28});c.onmousemove=e=>{let r=c.getBoundingClientRect();p.x=(e.clientX-r.left)/r.width*500-35};document.querySelector('#reset').onclick=reset;function loop(){if(over){x.fillStyle='#ff168f';x.font='28px monospace';x.fillText('OYUN BİTTİ',155,300);return}p.x=Math.max(0,Math.min(430,p.x));b.x+=b.vx;b.y+=b.vy;if(b.x<8||b.x>492)b.vx*=-1;if(b.y<8)b.vy*=-1;if(b.y>560){over=true}if(b.y>545&&b.x>p.x&&b.x<p.x+70)b.vy=-Math.abs(b.vy);bricks.forEach(k=>{if(k.on&&b.x>k.x&&b.x<k.x+k.w&&b.y>k.y&&b.y<k.y+k.h){k.on=false;b.vy*=-1;score++;document.querySelector('#score').textContent=score}});x.fillStyle='#12091b';x.fillRect(0,0,500,600);bricks.forEach(k=>{if(k.on){x.fillStyle='#00fff0';x.fillRect(k.x,k.y,k.w,k.h)}});x.fillStyle='#fff000';x.fillRect(p.x,550,70,12);x.fillStyle='#ff168f';x.beginPath();x.arc(b.x,b.y,8,0,7);x.fill();requestAnimationFrame(loop)}reset();</script></body></html>
