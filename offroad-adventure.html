<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Off-Road Macera</title>
<style>
:root{--accent:#d99a4e}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;overflow:hidden;font-family:'Courier New',monospace}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;z-index:2}
.panel{position:absolute;top:16px;left:16px;background:rgba(0,0,0,.55);padding:10px 14px;border:1px solid var(--accent);border-radius:4px;font-size:12px;line-height:1.8}
.panel b{color:var(--accent)}
#msg{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);text-align:center;background:rgba(0,0,0,.78);padding:24px 32px;border:1px solid var(--accent);border-radius:6px;display:none}
#msg button{margin-top:14px;padding:10px 18px;background:var(--accent);border:0;color:#05070a;font:bold 12px 'Courier New',monospace;cursor:pointer;pointer-events:all}
#tip{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:10px;color:rgba(255,255,255,.55);white-space:nowrap;text-align:center}
</style>
</head>
<body>
<div id="hud">
  <div class="panel" id="stats">KONTROL 0/6</div>
  <div id="msg"><h2 id="msgTitle">SÜRE DOLDU</h2><p id="msgText"></p><button id="msgBtn">YENİDEN BAŞLA</button></div>
  <div id="tip">W/S veya ↑/↓: GAZ-FREN | A/D veya ←/→: DÖN | R: YENİDEN BAŞLA</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0xcfa864);scene.fog=new THREE.FogExp2(0xcfa864,0.0035);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,700);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,1.3));
const sun=new THREE.DirectionalLight(0xffffff,1.3);sun.position.set(150,200,80);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(900,900),new THREE.MeshLambertMaterial({color:0xc99a5b}));ground.rotation.x=-Math.PI/2;scene.add(ground);

for(let i=0;i<60;i++){
  const h=3+Math.random()*7;
  const dune=new THREE.Mesh(new THREE.ConeGeometry(6+Math.random()*8,h,8),new THREE.MeshLambertMaterial({color:0xd2a868}));
  dune.position.set((Math.random()-0.5)*800,h/2-2,(Math.random()-0.5)*800);scene.add(dune);
}
const rocks=[];
for(let i=0;i<26;i++){
  const rx=(Math.random()-0.5)*500,rz=(Math.random()-0.5)*500;
  if(Math.hypot(rx,rz)<20)continue;
  const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(2+Math.random()*2),new THREE.MeshLambertMaterial({color:0x8a6b45}));rock.position.set(rx,1.4,rz);scene.add(rock);
  rocks.push({x:rx,z:rz,r:3});
}

const CP_COUNT=6;const checkpoints=[];
let cx=0,cz=0;
for(let i=0;i<CP_COUNT;i++){
  const angle=Math.random()*Math.PI*2,dist=60+Math.random()*40;
  cx+=Math.cos(angle)*dist;cz+=Math.sin(angle)*dist;
  const flag=new THREE.Mesh(new THREE.ConeGeometry(3,8,10),new THREE.MeshBasicMaterial({color:0x666666}));
  flag.position.set(cx,4,cz);scene.add(flag);
  checkpoints.push({mesh:flag,x:cx,z:cz});
}
function highlightNext(){checkpoints.forEach((c,i)=>c.mesh.material.color.set(i===nextCP?0xffe45e:(i<nextCP?0x33cc55:0x666666)));}

const buggy=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(2.4,0.9,3.6),new THREE.MeshLambertMaterial({color:0xd99a4e}));body.position.y=0.9;buggy.add(body);
const roll=new THREE.Mesh(new THREE.TorusGeometry(1.4,0.12,6,12),new THREE.MeshLambertMaterial({color:0x333333}));roll.rotation.x=Math.PI/2;roll.position.set(0,1.7,0);buggy.add(roll);
scene.add(buggy);

let px=0,pz=0,heading=0,speed=0,nextCP=0,timeLeft=100,over=false;
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='r')restart();if(e.code==='Space')e.preventDefault();});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function updateBuggy(dt){
  const up=keys['w']||keys['arrowup'],down=keys['s']||keys['arrowdown'],left=keys['a']||keys['arrowleft'],right=keys['d']||keys['arrowright'];
  if(up)speed=Math.min(speed+16*dt,28);else if(down)speed=Math.max(speed-15*dt,-10);else speed*=Math.pow(0.9,dt*60);
  const turnAmt=1.9*dt*(0.3+0.7*Math.min(1,Math.abs(speed)/28))*(speed<0?-1:1);
  if(left)heading+=turnAmt;if(right)heading-=turnAmt;
  const nx=px+Math.sin(heading)*speed*dt,nz=pz+Math.cos(heading)*speed*dt;
  const hitRock=rocks.find(r=>Math.hypot(nx-r.x,nz-r.z)<r.r+1.4);
  if(hitRock){speed*=-0.35;}else{px=nx;pz=nz;}
  buggy.position.set(px,Math.sin(Date.now()*0.01+px*0.05)*0.15,pz);buggy.rotation.y=heading;
  if(nextCP<CP_COUNT){const cp=checkpoints[nextCP];if(Math.hypot(px-cp.x,pz-cp.z)<8){nextCP++;highlightNext();if(nextCP>=CP_COUNT)endGame(true,'PARKUR TAMAMLANDI!');}}
}
function endGame(win,title){over=true;clearInterval(timerId);document.querySelector('#msg').style.display='block';document.querySelector('#msgTitle').textContent=title;document.querySelector('#msgText').textContent='Kontrol noktası: '+nextCP+'/'+CP_COUNT;}
function restart(){px=0;pz=0;heading=0;speed=0;nextCP=0;timeLeft=100;over=false;highlightNext();document.querySelector('#msg').style.display='none';clearInterval(timerId);startTimer();}
document.querySelector('#msgBtn').onclick=restart;
function startTimer(){timerId=setInterval(()=>{if(over)return;timeLeft--;if(timeLeft<=0){timeLeft=0;endGame(false,'SÜRE DOLDU');}updateHUD();},1000);}
let timerId;startTimer();highlightNext();
function updateHUD(){document.querySelector('#stats').innerHTML='KONTROL <b>'+nextCP+'/'+CP_COUNT+'</b><br>SÜRE <b>'+timeLeft+'s</b><br>HIZ <b>'+Math.abs(Math.round(speed*2))+'</b>';}
function updateCamera(){const tx=px-Math.sin(heading)*12,tz=pz-Math.cos(heading)*12;camera.position.lerp(new THREE.Vector3(tx,6,tz),0.12);camera.lookAt(px,1.5,pz);}
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),0.05);if(!over)updateBuggy(dt);updateCamera();renderer.render(scene,camera);}
updateHUD();animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
