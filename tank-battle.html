<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tank Savaşı</title>
<style>
:root{--accent:#ff4444}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;overflow:hidden;font-family:'Courier New',monospace}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;z-index:2}
.panel{position:absolute;top:16px;left:16px;background:rgba(0,0,0,.55);padding:10px 14px;border:1px solid var(--accent);border-radius:4px;font-size:12px;line-height:1.8}
.panel b{color:var(--accent)}
#msg{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);text-align:center;background:rgba(0,0,0,.78);padding:24px 32px;border:1px solid var(--accent);border-radius:6px;display:none}
#msg button{margin-top:14px;padding:10px 18px;background:var(--accent);border:0;color:#05070a;font:bold 12px 'Courier New',monospace;cursor:pointer;pointer-events:all}
#tip{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:10px;color:rgba(255,255,255,.55);white-space:nowrap;text-align:center}
</style>
</head>
<body>
<div id="hud">
  <div class="panel" id="stats">SKOR 0</div>
  <div id="msg"><h2 id="msgTitle">SÜRE DOLDU</h2><p id="msgText"></p><button id="msgBtn">YENİDEN BAŞLA</button></div>
  <div id="tip">↑/↓: İLERİ-GERİ | ←/→: DÖN | A/D: KULE | BOŞLUK: ATEŞ | R: YENİDEN BAŞLA</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x2b3a2b);scene.fog=new THREE.FogExp2(0x2b3a2b,0.006);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,700);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,1.2));
const sun=new THREE.DirectionalLight(0xffffff,1.2);sun.position.set(100,180,60);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshLambertMaterial({color:0x3a4a30}));ground.rotation.x=-Math.PI/2;scene.add(ground);

const walls=[];
for(let i=0;i<10;i++){
  const w=6+Math.random()*8,d=4,h=3;
  let x,z;do{x=(Math.random()-0.5)*260;z=(Math.random()-0.5)*260;}while(Math.hypot(x,z)<25);
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:0x555544}));mesh.rotation.y=Math.random()*Math.PI;mesh.position.set(x,h/2,z);scene.add(mesh);
  walls.push({x,z,w:Math.abs(Math.cos(mesh.rotation.y))*w+Math.abs(Math.sin(mesh.rotation.y))*d,d:Math.abs(Math.sin(mesh.rotation.y))*w+Math.abs(Math.cos(mesh.rotation.y))*d});
}
function blocked(x,z,margin){return walls.some(o=>Math.abs(x-o.x)<o.w/2+margin&&Math.abs(z-o.z)<o.d/2+margin);}

const tank=new THREE.Group();
const hull=new THREE.Mesh(new THREE.BoxGeometry(2.6,1,3.6),new THREE.MeshLambertMaterial({color:0x3a5a3a}));hull.position.y=0.6;tank.add(hull);
const turretGroup=new THREE.Group();turretGroup.position.set(0,1.2,0);tank.add(turretGroup);
const turret=new THREE.Mesh(new THREE.CylinderGeometry(1,1.1,0.7,10),new THREE.MeshLambertMaterial({color:0x2e4a2e}));turretGroup.add(turret);
const barrel=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,2.6,8),new THREE.MeshLambertMaterial({color:0x222222}));barrel.rotation.x=Math.PI/2;barrel.position.set(0,0.1,1.6);turretGroup.add(barrel);
scene.add(tank);

const targets=[];
function spawnTarget(){
  let x,z;do{x=(Math.random()-0.5)*260;z=(Math.random()-0.5)*260;}while(Math.hypot(x,z)<25||blocked(x,z,3));
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(2,2.2,2),new THREE.MeshLambertMaterial({color:0xcc3333}));mesh.position.set(x,1.1,z);scene.add(mesh);
  targets.push({mesh,x,z,lastHit:0});
}
for(let i=0;i<6;i++)spawnTarget();

const shots=[];
let px=0,pz=0,heading=0,turretHeading=0,speed=0,health=100,score=0,timeLeft=60,over=false;
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='r')restart();if(e.code==='Space'){e.preventDefault();fire();}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function fire(){
  if(over)return;
  const dir=heading+turretHeading;
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(0.25,8,8),new THREE.MeshBasicMaterial({color:0xffe45e}));
  mesh.position.set(px+Math.sin(dir)*3,1.5,pz+Math.cos(dir)*3);scene.add(mesh);
  shots.push({mesh,x:mesh.position.x,z:mesh.position.z,dir,life:2});
}
function updateShots(dt){
  for(let i=shots.length-1;i>=0;i--){
    const s=shots[i];s.x+=Math.sin(s.dir)*60*dt;s.z+=Math.cos(s.dir)*60*dt;s.life-=dt;
    s.mesh.position.set(s.x,1.5,s.z);
    let hit=false;
    targets.forEach(t=>{if(Math.hypot(s.x-t.x,s.z-t.z)<2){hit=true;score++;let nx,nz;do{nx=(Math.random()-0.5)*260;nz=(Math.random()-0.5)*260;}while(Math.hypot(nx,nz)<25||blocked(nx,nz,3));t.x=nx;t.z=nz;t.mesh.position.set(nx,1.1,nz);}});
    if(hit||s.life<=0){scene.remove(s.mesh);shots.splice(i,1);}
  }
}
function damage(a){if(over)return;health=Math.max(0,health-a);if(health<=0)endGame('TANK YOK EDİLDİ');}
function updateTank(dt){
  const up=keys['arrowup'],down=keys['arrowdown'],left=keys['arrowleft'],right=keys['arrowright'],turretLeft=keys['a'],turretRight=keys['d'];
  if(up)speed=Math.min(speed+10*dt,14);else if(down)speed=Math.max(speed-10*dt,-8);else speed*=Math.pow(0.88,dt*60);
  const turnAmt=1.3*dt*(speed<0?-1:1);
  if(left)heading+=turnAmt;if(right)heading-=turnAmt;
  if(turretLeft)turretHeading+=1.6*dt;if(turretRight)turretHeading-=1.6*dt;
  const nx=px+Math.sin(heading)*speed*dt,nz=pz+Math.cos(heading)*speed*dt;
  if(!blocked(nx,nz,1.8)){px=nx;pz=nz;}else speed*=-0.3;
  px=Math.max(-195,Math.min(195,px));pz=Math.max(-195,Math.min(195,pz));
  tank.position.set(px,0,pz);tank.rotation.y=heading;turretGroup.rotation.y=turretHeading;
  targets.forEach(t=>{if(Math.hypot(t.x-px,t.z-pz)<16){t.lastHit+=dt;if(t.lastHit>2.4){t.lastHit=0;damage(8);}}});
}
function endGame(title){over=true;clearInterval(timerId);document.querySelector('#msg').style.display='block';document.querySelector('#msgTitle').textContent=title||'SÜRE DOLDU';document.querySelector('#msgText').textContent='Skor: '+score;}
function restart(){px=0;pz=0;heading=0;turretHeading=0;speed=0;health=100;score=0;timeLeft=60;over=false;document.querySelector('#msg').style.display='none';clearInterval(timerId);startTimer();}
document.querySelector('#msgBtn').onclick=restart;
function startTimer(){timerId=setInterval(()=>{if(over)return;timeLeft--;if(timeLeft<=0){timeLeft=0;endGame('SÜRE DOLDU');}updateHUD();},1000);}
let timerId;startTimer();
function updateHUD(){document.querySelector('#stats').innerHTML='SKOR <b>'+score+'</b><br>CAN <b>'+Math.round(health)+'%</b><br>SÜRE <b>'+timeLeft+'s</b>';}
function updateCamera(){const tx=px-Math.sin(heading)*13,tz=pz-Math.cos(heading)*13;camera.position.lerp(new THREE.Vector3(tx,7,tz),0.12);camera.lookAt(px,1.4,pz);}
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),0.05);if(!over){updateTank(dt);updateShots(dt);}updateCamera();renderer.render(scene,camera);}
updateHUD();animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
