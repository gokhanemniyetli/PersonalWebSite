<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uzay Atışı</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#03030b;color:#fff;font:16px monospace}.wrap{text-align:center}canvas{width:min(94vw,500px);height:auto;border:2px solid #ff168f;background:#05051a}button{margin:14px;padding:10px 18px;background:#00fff0;color:#03030b;border:0;font:inherit;cursor:pointer}</style></head><body><main class="wrap"><h1>UZAY ATIŞI</h1><p>Skor: <b id="score">0</b> | Hareket: ← → / A D, Ateş: Boşluk</p><canvas id="game" width="500" height="600"></canvas><button id="reset">YENİDEN BAŞLAT</button></main><script>const c=document.querySelector('#game'),x=c.getContext('2d'),keys={};let ship,shots,enemies,score,over,timer;function reset(){ship={x:250};shots=[];enemies=[];score=0;over=false;document.querySelector('#score').textContent=0;clearInterval(timer);timer=setInterval(()=>{if(!over)enemies.push({x:20+Math.random()*460,y:-20,v:1+Math.random()*2})},650);requestAnimationFrame(loop)}addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){shots.push({x:ship.x,y:550})}if(e.key==='r')reset()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelector('#reset').onclick=reset;function loop(){if(over){x.fillStyle='#ff168f';x.font='30px monospace';x.fillText('OYUN BİTTİ',155,300);return}if(keys.a||keys.arrowleft)ship.x-=5;if(keys.d||keys.arrowright)ship.x+=5;ship.x=Math.max(15,Math.min(485,ship.x));shots.forEach(b=>b.y-=8);enemies.forEach(e=>e.y+=e.v);for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];if(e.y>620)enemies.splice(i,1);for(let j=shots.length-1;j>=0;j--)if(Math.hypot(e.x-shots[j].x,e.y-shots[j].y)<22){enemies.splice(i,1);shots.splice(j,1);score++;document.querySelector('#score').textContent=score;break}if(e&&Math.hypot(e.x-ship.x,e.y-570)<25)over=true}x.fillStyle='#03030b';x.fillRect(0,0,500,600);x.fillStyle='#ff168f';enemies.forEach(e=>x.fillRect(e.x-12,e.y-12,24,24));x.fillStyle='#00fff0';shots.forEach(b=>x.fillRect(b.x-2,b.y,4,14));x.fillStyle='#fff000';x.beginPath();x.moveTo(ship.x,545);x.lineTo(ship.x-18,580);x.lineTo(ship.x+18,580);x.fill();requestAnimationFrame(loop)}reset();</script></body></html>
