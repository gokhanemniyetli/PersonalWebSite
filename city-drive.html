<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Şehir Sürüşü 3D</title>
<style>
:root{--accent:#00fff0}
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;overflow:hidden;font-family:'Courier New',monospace}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;z-index:2}
.panel{position:absolute;top:16px;left:16px;background:rgba(0,0,0,.55);padding:10px 14px;border:1px solid var(--accent);border-radius:4px;font-size:12px;line-height:1.8}
.panel b{color:var(--accent)}
#msg{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);text-align:center;background:rgba(0,0,0,.78);padding:24px 32px;border:1px solid var(--accent);border-radius:6px;display:none}
#msg button{margin-top:14px;padding:10px 18px;background:var(--accent);border:0;color:#05070a;font:bold 12px 'Courier New',monospace;cursor:pointer;pointer-events:all}
#tip{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:10px;color:rgba(255,255,255,.55);white-space:nowrap;text-align:center}
</style>
</head>
<body>
<div id="hud">
  <div class="panel" id="stats">SKOR <b>0</b></div>
  <div id="msg"><h2 id="msgTitle">SÜRE DOLDU</h2><p id="msgText">Skor: 0</p><button id="msgBtn">YENİDEN BAŞLA</button></div>
  <div id="tip">W/S veya ↑/↓: GAZ-FREN | A/D veya ←/→: DÖN | R: YENİDEN BAŞLA</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x86b7de);scene.fog=new THREE.FogExp2(0x86b7de,0.0032);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,700);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,0.65));
const sun=new THREE.DirectionalLight(0xfff2d9,1.55);sun.position.set(120,180,80);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-260;sun.shadow.camera.right=260;sun.shadow.camera.top=260;sun.shadow.camera.bottom=-260;sun.shadow.camera.near=10;sun.shadow.camera.far=500;scene.add(sun);

function makeAsphaltTexture(){
  const size=512,cvs=document.createElement('canvas');cvs.width=cvs.height=size;const ctx=cvs.getContext('2d');
  ctx.fillStyle='#0c0c0c';ctx.fillRect(0,0,size,size);
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=5;ctx.setLineDash([26,20]);
  ctx.beginPath();ctx.moveTo(size/2,0);ctx.lineTo(size/2,size);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,size/2);ctx.lineTo(size,size/2);ctx.stroke();
  return cvs;
}
const asphaltTex=new THREE.CanvasTexture(makeAsphaltTexture());asphaltTex.wrapS=asphaltTex.wrapT=THREE.RepeatWrapping;asphaltTex.repeat.set(40,40);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshStandardMaterial({map:asphaltTex,color:0x1a1a1a,roughness:0.95,metalness:0.05}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

function makeBuildingTexture(baseColor){
  const w=128,h=256,cvs=document.createElement('canvas');cvs.width=w;cvs.height=h;const ctx=cvs.getContext('2d');
  ctx.fillStyle=baseColor;ctx.fillRect(0,0,w,h);
  const cols=6,rows=14;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    if(Math.random()<0.6){ctx.fillStyle=Math.random()<0.5?'rgba(255,240,190,0.9)':'rgba(120,170,210,0.35)';ctx.fillRect(c*(w/cols)+4,r*(h/rows)+4,(w/cols)-8,(h/rows)-8);}
  }
  return new THREE.CanvasTexture(cvs);
}
const buildings=[];
const bMat=['#c8b090','#aab0c0','#d0c8b0','#90a8b8'].map(c=>new THREE.MeshStandardMaterial({map:makeBuildingTexture(c),roughness:0.85,metalness:0.05}));
for(let i=0;i<40;i++){
  const w=8+Math.random()*14,d=8+Math.random()*14,h=10+Math.random()*40;
  let x,z;do{x=(Math.random()-0.5)*360;z=(Math.random()-0.5)*360;}while(Math.hypot(x,z)<20);
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),bMat[i%4]);mesh.position.set(x,h/2,z);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);
  buildings.push({x,z,w,d});
}
function blocked(x,z,margin){return buildings.some(b=>Math.abs(x-b.x)<b.w/2+margin&&Math.abs(z-b.z)<b.d/2+margin);}

const coins=[];const coinGeo=new THREE.OctahedronGeometry(1.1);const coinMat=new THREE.MeshBasicMaterial({color:0xffd54a,wireframe:true});
function placeCoin(c){let x,z;do{x=(Math.random()-0.5)*360;z=(Math.random()-0.5)*360;}while(blocked(x,z,3));c.mesh.position.set(x,1.4,z);}
for(let i=0;i<16;i++){const mesh=new THREE.Mesh(coinGeo,coinMat);scene.add(mesh);const c={mesh};placeCoin(c);coins.push(c);}

function makeCar(bodyColor,cabColor){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.8,4.4),new THREE.MeshStandardMaterial({color:bodyColor,roughness:0.35,metalness:0.65}));body.position.y=0.55;body.castShadow=true;body.receiveShadow=true;g.add(body);
  const cab=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.6,2.2),new THREE.MeshStandardMaterial({color:cabColor,roughness:0.3,metalness:0.55}));cab.position.set(0,1.15,0.1);cab.castShadow=true;g.add(cab);
  const glassMat=new THREE.MeshStandardMaterial({color:0x9fd8ff,transparent:true,opacity:0.55,roughness:0.1,metalness:0.2});
  const windshield=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.5,0.06),glassMat);windshield.position.set(0,1.15,1.15);g.add(windshield);
  const rearGlass=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.5,0.06),glassMat);rearGlass.position.set(0,1.15,-0.95);g.add(rearGlass);
  const wheelGeo=new THREE.CylinderGeometry(0.38,0.38,0.3,14);const wheelMat=new THREE.MeshStandardMaterial({color:0x111111,roughness:0.9});
  [[0.95,0.4,1.4],[-0.95,0.4,1.4],[0.95,0.4,-1.4],[-0.95,0.4,-1.4]].forEach(([wx,wy,wz])=>{const wheel=new THREE.Mesh(wheelGeo,wheelMat);wheel.rotation.z=Math.PI/2;wheel.position.set(wx,wy,wz);wheel.castShadow=true;g.add(wheel);});
  const headL=new THREE.Mesh(new THREE.SphereGeometry(0.12,8,8),new THREE.MeshStandardMaterial({color:0xfff7dd,emissive:0xfff2b0,emissiveIntensity:1}));headL.position.set(0.75,0.55,2.2);g.add(headL);
  const headR=headL.clone();headR.position.x=-0.75;g.add(headR);
  const tailL=new THREE.Mesh(new THREE.SphereGeometry(0.1,8,8),new THREE.MeshStandardMaterial({color:0xff3333,emissive:0xaa0000,emissiveIntensity:1}));tailL.position.set(0.75,0.55,-2.2);g.add(tailL);
  const tailR=tailL.clone();tailR.position.x=-0.75;g.add(tailR);
  return g;
}
function makeTrafficCar(){
  const g=makeCar(0xaa2222,0x7a1717);scene.add(g);
  let x,z;do{x=(Math.random()-0.5)*300;z=(Math.random()-0.5)*300;}while(blocked(x,z,4));
  g.position.set(x,0,z);
  return{group:g,heading:Math.random()*Math.PI*2,speed:4+Math.random()*4,x,z};
}
const traffic=[];for(let i=0;i<8;i++)traffic.push(makeTrafficCar());

const car=makeCar(0x33c2b8,0x1c8f86);scene.add(car);

let px=0,pz=0,heading=0,speed=0,score=0,health=100,timeLeft=60,over=false;
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='r')restart();if(e.code==='Space')e.preventDefault();});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function damage(a){if(over)return;health=Math.max(0,health-a);if(health<=0)endGame(false,'ARAÇ HASAR ALDI');}

function updatePlayer(dt){
  const up=keys['w']||keys['arrowup'],down=keys['s']||keys['arrowdown'],left=keys['a']||keys['arrowleft'],right=keys['d']||keys['arrowright'];
  if(up)speed=Math.min(speed+18*dt,32);else if(down)speed=Math.max(speed-16*dt,-14);else speed*=Math.pow(0.9,dt*60);
  const turnAmt=2.0*dt*(0.3+0.7*Math.min(1,Math.abs(speed)/32))*(speed<0?-1:1);
  if(left)heading+=turnAmt;if(right)heading-=turnAmt;
  const nx=px+Math.sin(heading)*speed*dt,nz=pz+Math.cos(heading)*speed*dt;
  if(blocked(nx,nz,1.4)){if(Math.abs(speed)>8)damage(Math.abs(speed)*0.6);speed*=-0.3;}
  else{px=nx;pz=nz;}
  px=Math.max(-195,Math.min(195,px));pz=Math.max(-195,Math.min(195,pz));
  car.position.set(px,0,pz);car.rotation.y=heading;
}
function updateTraffic(dt){
  traffic.forEach(t=>{
    const nx=t.x+Math.sin(t.heading)*t.speed*dt,nz=t.z+Math.cos(t.heading)*t.speed*dt;
    if(blocked(nx,nz,2)||Math.abs(nx)>195||Math.abs(nz)>195){t.heading+=Math.PI+(Math.random()-0.5);}
    else{t.x=nx;t.z=nz;}
    t.group.position.set(t.x,0,t.z);t.group.rotation.y=t.heading;
    if(!over&&Math.hypot(t.x-px,t.z-pz)<3){damage(30*dt);speed*=-0.4;}
  });
}
function updateCoins(){
  coins.forEach(c=>{c.mesh.rotation.y+=0.05;c.mesh.position.y=1.4+Math.sin(Date.now()*0.003)*0.2;
    if(!over&&Math.hypot(c.mesh.position.x-px,c.mesh.position.z-pz)<2.6){score+=10;placeCoin(c);}
  });
}
function endGame(win,title){over=true;clearInterval(timerId);document.querySelector('#msg').style.display='block';document.querySelector('#msgTitle').textContent=title||(win?'SÜRE DOLDU':'BİTTİ');document.querySelector('#msgText').textContent='Skor: '+score;}
function restart(){score=0;health=100;timeLeft=60;over=false;px=0;pz=0;heading=0;speed=0;document.querySelector('#msg').style.display='none';coins.forEach(placeCoin);clearInterval(timerId);startTimer();}
document.querySelector('#msgBtn').onclick=restart;
function startTimer(){timerId=setInterval(()=>{if(over)return;timeLeft--;if(timeLeft<=0){timeLeft=0;endGame(true,'SÜRE DOLDU');}updateHUD();},1000);}
let timerId;startTimer();
function updateHUD(){document.querySelector('#stats').innerHTML='SKOR <b>'+score+'</b><br>CAN <b>'+Math.round(health)+'%</b><br>SÜRE <b>'+timeLeft+'s</b><br>HIZ <b>'+Math.abs(Math.round(speed*3))+'</b>';}
function updateCamera(){
  const tx=px-Math.sin(heading)*11,tz=pz-Math.cos(heading)*11;
  camera.position.lerp(new THREE.Vector3(tx,5,tz),0.12);
  camera.lookAt(px,1.4,pz);
}
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  if(!over){updatePlayer(dt);updateTraffic(dt);updateCoins();}
  updateCamera();
  renderer.render(scene,camera);
}
updateHUD();animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
